[package]
name = "midenc-release"
description = "Release tooling for Miden repos"
version = "0.1.0"
rust-version = "1.97"
authors = ["Miden contributors"]
repository = "https://github.com/0xMiden/release-tool"
homepage = "https://github.com/0xMiden/release-tool"
documentation = "https://github.com/0xMiden/release-tool"
categories = ["development-tools"]
keywords = ["miden"]
license = "MIT"
readme = "README.md"
edition = "2024"

[lib]
name = "midenc_release"
path = "src/lib.rs"

[[bin]]
name = "release-tool"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", default-features = false, features = [
    "derive",
    "std",
    "env",
    "help",
    "usage",
    "suggestions",
    "error-context",
] }
flate2 = "1.1"
semver = { version = "1.0", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0", features = ["derive", "std"] }
serde_json = "1.0"
toml = { version = "^1.1.2", features = ["preserve_order"] }
toml_edit = { version = "^0.25", features = ["serde"] }
